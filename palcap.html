<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pal Cap - Operaciones de Caja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Consolas', 'monospace']
                    }
                }
            }
        };
        (function () {
            try {
                if (localStorage.getItem('cctv_theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 p-3 sm:p-5 md:p-8 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200">

    <div class="max-w-6xl mx-auto bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 transition-colors duration-200">

        <!-- Header Estándar -->
        <header class="no-print bg-slate-900 dark:bg-slate-950 border-b border-slate-800 px-4 sm:px-6 py-4 rounded-t-2xl text-white flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl shadow-sm shrink-0 flex items-center justify-center">
                    <i data-lucide="wallet-cards" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold leading-tight text-white">Pal Cap · Operaciones de Caja</h1>
                    <p class="text-slate-400 text-xs uppercase tracking-wider">CCTV · Cambio de Efectivo por Tickets (<span id="fechaActual">--/--/--</span>)</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <a href="palvar.html" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl transition text-xs font-semibold text-white inline-flex items-center gap-1.5">
                    <i data-lucide="ticket" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Pal Var</span>
                </a>
                <a href="pagoaltoluxor.html" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition text-xs font-semibold text-slate-200 inline-flex items-center gap-1.5">
                    <i data-lucide="building-2" class="w-4 h-4 text-indigo-400"></i>
                    <span class="hidden sm:inline">Luxor</span>
                </a>

                <div class="hidden md:flex items-center gap-2 bg-slate-800/90 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-mono text-slate-200">
                    <i data-lucide="clock" class="w-3.5 h-3.5 text-indigo-400"></i>
                    <span data-cctv-clock class="tabular-nums">00:00:00 Hs.</span>
                </div>

                <div data-cctv-nav></div>

                <button type="button" onclick="toggleTheme()" title="Cambiar modo claro / oscuro"
                    class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition inline-flex items-center justify-center text-slate-200 cursor-pointer">
                    <i data-lucide="sun" class="w-5 h-5 text-amber-400 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 text-slate-200 block dark:hidden"></i>
                </button>

                <a href="index.html" title="Volver al Menú Principal"
                    class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition inline-flex items-center justify-center text-slate-200">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </a>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 rounded-b-2xl overflow-hidden">

            <!-- COLUMNA IZQUIERDA: INPUTS -->
            <div class="lg:col-span-7 p-5 sm:p-6 space-y-5 bg-slate-50 dark:bg-slate-900/60">

                <!-- 1. EMPLEADO -->
                <div class="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-2.5">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 flex items-center gap-1.5">
                            <i data-lucide="user-check" class="w-4 h-4"></i> 1. Empleado/a de Caja
                        </h3>
                        <button type="button" onclick="setNow('horaLlamada')" class="text-xs bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800/60 hover:bg-indigo-100 px-2.5 py-1 rounded-lg flex items-center gap-1 transition cursor-pointer font-semibold">
                            <i data-lucide="clock" class="w-3.5 h-3.5"></i> Ahora
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3.5">
                        <div class="sm:col-span-4">
                            <label for="horaLlamada" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Hora Llamada</label>
                            <input type="time" id="horaLlamada" oninput="generar()" class="w-full p-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-sm font-mono text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
                        </div>
                        <div class="sm:col-span-8">
                            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Cargo y Nombre Completo</label>
                            <div class="flex gap-2">
                                <select id="rolSolicitante" onchange="generar()" class="w-2/5 p-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                    <option value="Jefe de Caja">Jefe Caja</option>
                                    <option value="Asistente de Caja">Asistente</option>
                                    <option value="Cajera">Cajera</option>
                                    <option value="Cajero">Cajero</option>
                                </select>
                                <input type="text" id="nombreEmpleado" oninput="generar()" placeholder="Apellido y Nombre" class="w-3/5 p-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. TRANSACCIÓN -->
                <div class="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-2.5">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 flex items-center gap-1.5">
                            <i data-lucide="banknote" class="w-4 h-4"></i> 2. Cliente y Valores
                        </h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3.5">
                        <div class="sm:col-span-4">
                            <label for="generoCliente" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Género Cliente</label>
                            <select id="generoCliente" onchange="generar()" class="w-full p-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                <option value="M">Sr. (Masculino)</option>
                                <option value="F">Sra. (Femenino)</option>
                            </select>
                        </div>
                        <div class="sm:col-span-8">
                            <label for="nombreCliente" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Apellido y Nombre</label>
                            <input type="text" id="nombreCliente" oninput="generar()" placeholder="Ej: Gómez María" class="w-full p-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
                        </div>
                    </div>

                    <div>
                        <label for="montoEfectivo" class="block text-xs font-semibold text-emerald-700 dark:text-emerald-400 mb-1">Total Efectivo Recibido ($)</label>
                        <input type="text" id="montoEfectivo" oninput="validarMatematica(); generar()" placeholder="0" class="w-full p-2.5 border border-emerald-300 dark:border-emerald-700/70 bg-emerald-50/70 dark:bg-emerald-950/30 rounded-xl text-sm font-mono font-semibold text-emerald-900 dark:text-emerald-300 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                    </div>

                    <div class="space-y-2.5">
                        <div class="grid grid-cols-2 gap-3 bg-slate-50 dark:bg-slate-950/60 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                            <div>
                                <label for="cantTickets" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Cant. Tickets (1)</label>
                                <input type="text" id="cantTickets" oninput="validarMatematica(); generar()" placeholder="0" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label for="valorTicket" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Valor Unitario ($)</label>
                                <input type="text" id="valorTicket" oninput="validarMatematica(); generar()" placeholder="0" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 bg-slate-50 dark:bg-slate-950/60 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                            <div>
                                <label for="cantTickets2" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Cant. Tickets (2)</label>
                                <input type="text" id="cantTickets2" oninput="validarMatematica(); generar()" placeholder="Opcional" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label for="valorTicket2" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Valor Unitario ($)</label>
                                <input type="text" id="valorTicket2" oninput="validarMatematica(); generar()" placeholder="Opcional" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 bg-slate-50 dark:bg-slate-950/60 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                            <div>
                                <label for="cantTickets3" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Cant. Tickets (3)</label>
                                <input type="text" id="cantTickets3" oninput="validarMatematica(); generar()" placeholder="Opcional" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label for="valorTicket3" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Valor Unitario ($)</label>
                                <input type="text" id="valorTicket3" oninput="validarMatematica(); generar()" placeholder="Opcional" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>
                    </div>

                    <div id="alertaValidacion" class="hidden text-xs p-2.5 rounded-xl flex items-center gap-2"></div>
                </div>

                <!-- 3. CIERRE -->
                <div class="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-2.5">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 flex items-center gap-1.5">
                            <i data-lucide="check-circle-2" class="w-4 h-4"></i> 3. Cierre de Operación
                        </h3>
                        <button type="button" onclick="setNow('horaEntrega')" class="text-xs bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800/60 hover:bg-indigo-100 px-2.5 py-1 rounded-lg flex items-center gap-1 transition cursor-pointer font-semibold">
                            <i data-lucide="clock" class="w-3.5 h-3.5"></i> Ahora
                        </button>
                    </div>
                    <div>
                        <label for="horaEntrega" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Hora Entrega por Ventanilla</label>
                        <input type="time" id="horaEntrega" oninput="generar()" class="w-full p-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-sm font-mono text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                </div>

                <div class="flex gap-3">
                    <button type="button" onclick="limpiarFormulario()" class="px-4 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-sm cursor-pointer">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Limpiar Formulario
                    </button>
                </div>
            </div>

            <!-- COLUMNA DERECHA: RESULTADO -->
            <div class="lg:col-span-5 bg-slate-100/80 dark:bg-slate-950/60 border-t lg:border-t-0 lg:border-l border-slate-200 dark:border-slate-800 p-5 sm:p-6 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-700 dark:text-slate-200 flex items-center gap-2">
                            <i data-lucide="file-text" class="w-4 h-4 text-indigo-500"></i> Vista Previa
                        </h2>
                    </div>

                    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-3">
                        <textarea id="resultadoTexto" class="report-font w-full h-64 p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs sm:text-sm leading-relaxed text-slate-800 dark:text-slate-100 resize-none outline-none" readonly spellcheck="false"></textarea>
                    </div>

                    <button type="button" onclick="copiarTexto()" class="mt-4 w-full px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 shadow-sm cursor-pointer">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                        <span>Copiar al Portapapeles</span>
                    </button>

                    <div id="toast" class="hidden mt-3 bg-emerald-100 dark:bg-emerald-950/60 border border-emerald-300 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300 px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2 fade-in">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                        <span>Copiado al portapapeles.</span>
                    </div>

                    <!-- Resumen Matemático -->
                    <div class="mt-6 border-t border-slate-200 dark:border-slate-800 pt-4">
                        <h4 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2.5">Validación de Importes</h4>
                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <div class="bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                                <span class="block text-xs text-slate-500 dark:text-slate-400">Total Efectivo</span>
                                <span class="font-mono font-bold text-emerald-600 dark:text-emerald-400" id="resumenEfectivo">$0,00</span>
                            </div>
                            <div class="bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                                <span class="block text-xs text-slate-500 dark:text-slate-400">Valor Tickets</span>
                                <span class="font-mono font-bold text-indigo-600 dark:text-indigo-400" id="resumenTickets">$0,00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/global.js"></script>
    <script>
        document.getElementById('fechaActual').innerText = new Date().toLocaleDateString('es-AR');

        function setNow(id) {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById(id).value = `${hours}:${minutes}`;
            generar();
        }

        const moneyFormat = (num) => {
            if (!num) return "$ 0,00";
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 2 }).format(num);
        };

        function parseLocalFloat(str) {
            if (!str) return 0;
            const s = String(str).trim().replace(/[^\d.,]/g, '');
            if (!s) return 0;
            if (s.includes(',')) {
                return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
            }
            const dotParts = s.split('.');
            if (dotParts.length === 2 && dotParts[1].length <= 2 && dotParts[0].length >= 4) {
                return parseFloat(s) || 0;
            }
            return parseFloat(s.replace(/\./g, '')) || 0;
        }

        function validarMatematica() {
            const efectivo = parseLocalFloat(document.getElementById('montoEfectivo').value);

            const cant1 = parseLocalFloat(document.getElementById('cantTickets').value);
            const val1 = parseLocalFloat(document.getElementById('valorTicket').value);

            const cant2 = parseLocalFloat(document.getElementById('cantTickets2').value);
            const val2 = parseLocalFloat(document.getElementById('valorTicket2').value);

            const cant3 = parseLocalFloat(document.getElementById('cantTickets3').value);
            const val3 = parseLocalFloat(document.getElementById('valorTicket3').value);

            const totalTickets = (cant1 * val1) + (cant2 * val2) + (cant3 * val3);

            document.getElementById('resumenEfectivo').innerText = moneyFormat(efectivo);
            document.getElementById('resumenTickets').innerText = moneyFormat(totalTickets);

            const alerta = document.getElementById('alertaValidacion');

            if (efectivo > 0 && (cant1 > 0 || cant2 > 0 || cant3 > 0)) {
                alerta.classList.remove('hidden');
                if (Math.abs(efectivo - totalTickets) < 0.01) {
                    alerta.className = "text-xs p-2.5 rounded-xl flex items-center gap-2 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 fade-in";
                    alerta.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> <span>Coincide perfectamente.</span>`;
                } else {
                    const dif = Math.abs(efectivo - totalTickets);
                    alerta.className = "text-xs p-2.5 rounded-xl flex items-center gap-2 bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800 fade-in";
                    alerta.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4"></i> <span>Diferencia de ${moneyFormat(dif)}</span>`;
                }
                if (window.lucide) lucide.createIcons();
            } else {
                alerta.classList.add('hidden');
            }
        }

        function generar() {
            const h1 = document.getElementById('horaLlamada').value || "--:--";
            const rol = document.getElementById('rolSolicitante').value;
            const emp = document.getElementById('nombreEmpleado').value || "___";

            const nombreCli = document.getElementById('nombreCliente').value || "___";
            const genero = document.getElementById('generoCliente').value;

            const txtCliente = genero === 'F' ? `clienta Sra. ${nombreCli}` : `cliente Sr. ${nombreCli}`;

            const monto = document.getElementById('montoEfectivo').value || "0";
            const h2 = document.getElementById('horaEntrega').value || "--:--";

            const cant1 = document.getElementById('cantTickets').value || "0";
            const val1 = document.getElementById('valorTicket').value || "0";
            const cant2 = document.getElementById('cantTickets2').value;
            const val2 = document.getElementById('valorTicket2').value;
            const cant3 = document.getElementById('cantTickets3').value;
            const val3 = document.getElementById('valorTicket3').value;

            const wordTk = n => Number(n) === 1 ? 'ticket' : 'tickets';
            let txtTickets = `${cant1} ${wordTk(cant1)} de valor $${val1}`;
            let txtEntrega = `${cant1} ${wordTk(cant1)}`;

            if (cant2 && val2 && parseLocalFloat(cant2) > 0) {
                txtTickets += `, ${cant2} ${wordTk(cant2)} de valor $${val2}`;
                txtEntrega = `la totalidad de los tickets`;
            }

            if (cant3 && val3 && parseLocalFloat(cant3) > 0) {
                txtTickets += ` y ${cant3} ${wordTk(cant3)} de valor $${val3}`;
                txtEntrega = `la totalidad de los tickets`;
            }

            const pronEmpleado = rol === 'Cajera' ? 'la misma' : 'el mismo';

            const t = `A las ${h1} Hs. CCTV recibe llamada de ${rol} ${emp}, informa que ${txtCliente} le entrega $${monto} en efectivo y solicita que se lo cambie por tickets. A su vez ${pronEmpleado} también informa que procede a imprimir ${txtTickets}.-\n\nA las ${h2} Hs. ${rol} ${emp}, entrega ${txtEntrega} a ${txtCliente} por ventanilla de caja.-`;

            document.getElementById('resultadoTexto').value = t;
        }

        async function copiarTexto() {
            const copyText = document.getElementById("resultadoTexto");
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(copyText.value);
                } else {
                    copyText.select();
                    copyText.setSelectionRange(0, 99999);
                    document.execCommand('copy');
                }
            } catch (e) {
                copyText.select();
                copyText.setSelectionRange(0, 99999);
                document.execCommand('copy');
            }

            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function limpiarFormulario() {
            if (confirm('¿Borrar formulario?')) {
                document.querySelectorAll('input').forEach(i => i.value = '');
                document.getElementById('generoCliente').value = 'M';
                document.getElementById('alertaValidacion').classList.add('hidden');
                generar();
                validarMatematica();
            }
        }

        generar();
    </script>
</body>
