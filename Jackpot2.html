        ];

        function normJp(s) {
            return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
        }

        function escJp(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Acepta formato argentino (1.250.430,50) e internacional (1250430.50)
        function parseMontoAR(raw) {
            const s = String(raw || '').replace(/[^\d.,-]/g, '').trim();
            if (!s) return NaN;
            const lastComma = s.lastIndexOf(',');
            const lastDot = s.lastIndexOf('.');
            let normalized = s;
            if (lastComma !== -1 && lastDot !== -1) {
                if (lastComma > lastDot) {
                    normalized = s.replace(/\./g, '').replace(',', '.');
                } else {
                    normalized = s.replace(/,/g, '');
                }
            } else if (lastComma !== -1) {
                normalized = s.replace(',', '.');
            } else if ((s.match(/\./g) || []).length > 1) {
                normalized = s.replace(/\./g, '');
            }
            const num = parseFloat(normalized);
            return isNaN(num) ? NaN : num;
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('es-AR', {
                style: 'decimal',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(isNaN(amount) ? 0 : amount);
        }

        function horaActualJp(offset = 0) {
            const d = new Date();
            d.setMinutes(d.getMinutes() + offset);
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function sumarMinutosJp(hhmm, delta) {
            if (!hhmm || !hhmm.includes(':')) return horaActualJp(delta);
            const [h, m] = hhmm.split(':').map(Number);
            const tot = ((h * 60 + m + delta) % 1440 + 1440) % 1440;
            return `${String(Math.floor(tot / 60)).padStart(2, '0')}:${String(tot % 60).padStart(2, '0')}`;
        }

        window.ponerHoraJackpot = function (id) {
            const el = document.getElementById(id);
            if (el) {
                el.value = horaActualJp();
                generateText();
            }
        };

        window.autocompletarSecuenciaHoraria = function () {
            const h1El = document.getElementById('hora1');
            if (!h1El.value) h1El.value = horaActualJp();
            const base = h1El.value;
            if (!document.getElementById('hora2').value) document.getElementById('hora2').value = sumarMinutosJp(base, 2);
            if (!document.getElementById('hora3').value) document.getElementById('hora3').value = sumarMinutosJp(base, 6);
            if (!document.getElementById('hora4').value) document.getElementById('hora4').value = sumarMinutosJp(base, 8);
            generateText();
            mostrarAvisoJp('⚡ Secuencia horaria completada');
        };

        window.buscarStaffJackpot = function (inputId, dropId, tipoLista) {
            const inp = document.getElementById(inputId);
            const menu = document.getElementById(dropId);
            if (!inp || !menu) return;
            const q = normJp(inp.value);
            if (!q) {
                menu.classList.add('hidden');
                return;
            }
            const fuente = tipoLista === 'caja' ? STAFF_CAJA_JP : STAFF_SALA_JP;
            const matches = fuente.filter(item => normJp(item).includes(q) && normJp(item) !== q);
            if (!matches.length) {
                menu.classList.add('hidden');
                return;
            }
            menu._matches = matches;
            menu.innerHTML = matches.map((nom, i) => `
                <button type="button" onmousedown="event.preventDefault(); elegirStaffJackpot('${inputId}','${dropId}',${i})"
                    class="w-full text-left px-3 py-2 text-xs font-semibold text-slate-800 dark:text-slate-100 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 transition cursor-pointer">
                    ${escJp(nom)}
                </button>
            `).join('');
            menu.classList.remove('hidden');
        };

        window.elegirStaffJackpot = function (inputId, dropId, idx) {
            const menu = document.getElementById(dropId);
            const val = menu?._matches?.[idx];
            if (!val) return;
            document.getElementById(inputId).value = val;
            menu.classList.add('hidden');
            generateText();
        };

        window.ocultarDropJp = function (dropId) {
            setTimeout(() => document.getElementById(dropId)?.classList.add('hidden'), 150);
        };

        function guardarBorradorJp2() {
            try {
                const campos = ['hora1', 'hora2', 'hora3', 'hora4', 'nombrePersonal', 'nombreMaquina', 'ventanilla', 'valorDe', 'progresivoValor', 'totalPremio', 'cliente', 'tipoCliente', 'jefeCaja', 'responsableDescarga', 'maquinaInfo', 'juegoInfo', 'pagoManualInfo'];
                const obj = { checkFichaTecnica: document.getElementById('checkFichaTecnica').checked };
                campos.forEach(id => { obj[id] = document.getElementById(id)?.value || ''; });
                localStorage.setItem(STORAGE_JP2_KEY, JSON.stringify(obj));
            } catch (e) {}
        }

        window.generateText = function () {
            const rH1 = document.getElementById('hora1').value;
            const rH2 = document.getElementById('hora2').value;
            const rH3 = document.getElementById('hora3').value;
            const rH4 = document.getElementById('hora4').value;

            const hora1 = rH1 || '--:--';
            const hora2 = rH2 || '--:--';
            const hora3 = rH3 || '--:--';
            const hora4 = rH4 || '--:--';

            const rawPersonal = document.getElementById('nombrePersonal').value.trim();
            const nombrePersonal = rawPersonal || '___';
            const responsableDescarga = document.getElementById('responsableDescarga').value.trim() || nombrePersonal;
            const rawMaq = document.getElementById('nombreMaquina').value.trim();
            const nombreMaquina = rawMaq || '___';

            const vBaseParsed = parseMontoAR(document.getElementById('valorDe').value);
            const vProgParsed = parseMontoAR(document.getElementById('progresivoValor').value);
            const vTotParsed = parseMontoAR(document.getElementById('totalPremio').value);

            const valorDe = isNaN(vBaseParsed) ? 0 : vBaseParsed;
            const progresivoValor = isNaN(vProgParsed) ? 0 : vProgParsed;
            const totalPremio = isNaN(vTotParsed) ? (valorDe + progresivoValor) : vTotParsed;

            document.getElementById('previewTotalBadge').textContent = `Total: $ ${formatCurrency(totalPremio)}`;

            const rawCli = document.getElementById('cliente').value.trim();
            const cliente = rawCli || '___';
            const tipoCliente = document.getElementById('tipoCliente').value;
            const rawJefe = document.getElementById('jefeCaja').value.trim();
            const jefeCaja = rawJefe || '___';
            const rawVent = document.getElementById('ventanilla').value.trim();
            const ventanilla = rawVent || '___';

            const incluirFicha = document.getElementById('checkFichaTecnica').checked;
            document.getElementById('gridFichaTecnicaJp')?.classList.toggle('opacity-50', !incluirFicha);

            const maquinaInfo = document.getElementById('maquinaInfo').value.trim() || rawMaq || '---';
            const juegoInfo = document.getElementById('juegoInfo').value.trim() || '---';
            const pagoManualInfo = document.getElementById('pagoManualInfo').value.trim() || '---';

            const prefijo = tipoCliente === 'clienta' ? 'la Sra.' : 'el Sr.';

            let texto = `A las ${hora1} Hs. CCTV recibe llamada de ${nombrePersonal}, informa Jackpot en Máq. ${nombreMaquina} por un valor de $${formatCurrency(valorDe)}, se suma progresivo de $${formatCurrency(progresivoValor)} alcanzando un total de $${formatCurrency(totalPremio)}.-
(A las ${hora2} Hs.) Revisión muestra que ${prefijo} ${cliente} jugaba en Máq. ${nombreMaquina} al salir el premio.-
A las ${hora3} Hs. Jefe de Caja ${jefeCaja} cancela en ventanilla ${ventanilla} $${formatCurrency(totalPremio)} a ${prefijo} ${cliente}.-
A las ${hora4} Hs. ${responsableDescarga} registra y descarga el premio de Máq. ${nombreMaquina}.-`;

            if (incluirFicha) {
                texto += `\n\nMáquina: ${maquinaInfo}\nJuego: ${juegoInfo}\nPago manual: ${pagoManualInfo}\n\nApéndice 1: Fotos.-`;
            }

            document.getElementById('outputText').value = texto;

            let faltantes = 0;
            [rH1, rH2, rH3, rH4, rawPersonal, rawMaq, rawCli, rawJefe, rawVent].forEach(v => { if (!v) faltantes++; });
            if (totalPremio <= 0) faltantes++;

            const bEst = document.getElementById('badgeEstadoJp2');
            if (bEst) {
                if (faltantes === 0) {
                    bEst.textContent = '✓ Completo p/ copiar';
                    bEst.className = 'text-[11px] bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 px-2.5 py-0.5 rounded-full font-semibold';
                } else {
                    bEst.textContent = `${faltantes} dato(s) pendiente(s)`;
                    bEst.className = 'text-[11px] bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 px-2.5 py-0.5 rounded-full font-semibold';
                }
            }

            guardarBorradorJp2();
        };

        function mostrarAvisoJp(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsgJp').textContent = msg;
            toast.classList.remove('hidden');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.add('hidden'), 2800);
        }

        window.copyText = async function () {
            const area = document.getElementById('outputText');
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(area.value);
                } else {
                    area.select();
                    document.execCommand('copy');
                }
            } catch (e) {
                area.select();
                document.execCommand('copy');
            }
            mostrarAvisoJp('📋 Acta Jackpot copiada al portapapeles.');
        };

        window.descargarJpTXT = function () {
            const txt = document.getElementById('outputText').value.trim();
            if (!txt) return;
            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const maq = (document.getElementById('nombreMaquina').value.trim() || 'maq').replace(/\s+/g, '_');
            a.download = `jackpot_mod2_${maq}_${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            mostrarAvisoJp('📥 Archivo TXT descargado.');
        };

        window.toggleTheme = function () {
            if (window.CCTVTheme) {
                window.CCTVTheme.toggle();
                return;
            }
            document.documentElement.classList.toggle('dark');
        };

        document.getElementById('btnLimpiar').addEventListener('click', () => {
            if (!confirm('¿Limpiar todos los datos del formulario de Jackpot?')) return;
            document.querySelectorAll('#textForm input, #textForm select').forEach(el => {
                if (el.type === 'checkbox') el.checked = true;
                else if (el.type === 'select-one') el.selectedIndex = 0;
                else el.value = '';
            });
            generateText();
            mostrarAvisoJp('Formulario reiniciado.');
        });

        document.getElementById('textForm').addEventListener('input', generateText);
        document.getElementById('textForm').addEventListener('change', generateText);

        window.addEventListener('DOMContentLoaded', function () {
            document.getElementById('fechaActual').textContent = new Date().toLocaleDateString('es-AR');
            try {
                const raw = localStorage.getItem(STORAGE_JP2_KEY);
                if (raw) {
                    const saved = JSON.parse(raw);
                    if (saved && typeof saved === 'object') {
                        Object.keys(saved).forEach(k => {
                            if (k === 'checkFichaTecnica') {
                                document.getElementById('checkFichaTecnica').checked = Boolean(saved[k]);
                            } else if (document.getElementById(k)) {
                                document.getElementById(k).value = saved[k];
                            }
                        });
                    }
                }
            } catch (e) {}
            generateText();
            if (window.lucide) lucide.createIcons();
        });
    </script>
    <script src="js/global.js"></script>
</body>
