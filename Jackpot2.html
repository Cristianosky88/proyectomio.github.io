<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackpot - Modelo N° 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Consolas', 'monospace']
                    }
                }
            }
        };
        (function() {
            try {
                if (localStorage.getItem('cctv_theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 p-3 sm:p-5 md:p-8 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200">

    <div class="max-w-6xl mx-auto bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 transition-colors duration-200">
        <!-- Header Estándar -->
        <header class="no-print bg-slate-900 dark:bg-slate-950 border-b border-slate-800 px-4 sm:px-6 py-4 rounded-t-2xl text-white flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl shadow-sm shrink-0 flex items-center justify-center">
                    <i data-lucide="zap" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold leading-tight text-white">Jackpot · Modelo N° 2</h1>
                    <p class="text-slate-400 text-xs uppercase tracking-wider">CCTV · Progresivo en Vivo (<span id="fechaActual">--/--/--</span>)</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <a href="jackpot.html" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl transition text-white text-xs font-semibold flex items-center gap-1.5" title="Ir a Jackpot Modelo 1">
                    <i data-lucide="trophy" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Modelo 1</span>
                </a>
                <a href="jackpotluxor.html" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition text-slate-200 text-xs font-semibold flex items-center gap-1.5" title="Ir a Jackpot Luxor">
                    <i data-lucide="coins" class="w-4 h-4 text-indigo-400"></i>
                    <span class="hidden sm:inline">Luxor</span>
                </a>
                <div class="hidden md:flex items-center gap-2 bg-slate-800/90 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-mono text-slate-200">
                    <i data-lucide="clock" class="w-3.5 h-3.5 text-indigo-400"></i>
                    <span data-cctv-clock class="tabular-nums">00:00:00 Hs.</span>
                </div>
                <div data-cctv-nav></div>
                <button type="button" onclick="toggleTheme()" title="Cambiar modo claro / oscuro" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition inline-flex items-center justify-center shrink-0 text-slate-200 cursor-pointer">
                    <i data-lucide="sun" class="w-5 h-5 text-amber-400 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 text-slate-200 block dark:hidden"></i>
                </button>
                <a id="btnInicioHeader" href="index.html" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition text-slate-200 inline-flex items-center justify-center" title="Volver al Menú Principal">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </a>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 rounded-b-2xl overflow-hidden">
            <!-- Formulario -->
            <div class="lg:col-span-7 p-6 bg-slate-50 dark:bg-slate-900/60">
                <form id="textForm" class="space-y-5" onsubmit="event.preventDefault(); generateText();">
                    <!-- Datos principales -->
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
                        <h3 class="font-bold text-slate-700 dark:text-slate-200 text-sm flex items-center gap-2">
                            <span class="bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">1</span>
                            Datos principales
                        </h3>

                        <div class="grid grid-cols-12 gap-4">
                            <div class="col-span-12 sm:col-span-4">
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Hora aviso</label>
                                <input type="time" id="hora1" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div class="col-span-12 sm:col-span-8">
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Cargo y Nombre del personal</label>
                                <input type="text" id="nombrePersonal" placeholder="Ej: Enc. Gómez Juan" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-12 gap-4">
                            <div class="col-span-6">
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">N° Máquina</label>
                                <input type="text" id="nombreMaquina" placeholder="Ej: 120305" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono dark:text-white outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div class="col-span-6">
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Ventanilla</label>
                                <input type="text" id="ventanilla" placeholder="Ej: de caja N° 1" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Valor base ($)</label>
                                <input type="number" step="0.01" id="valorDe" placeholder="0.00" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono dark:text-white outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Progresivo ($)</label>
                                <input type="number" step="0.01" id="progresivoValor" placeholder="0.00" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono dark:text-white outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Total premio ($)</label>
                                <input type="number" step="0.01" id="totalPremio" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono dark:text-white outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Auto (Base+Prog)">
                            </div>
                        </div>
                    </div>

                    <!-- Tiempos y cliente -->
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
                        <h3 class="font-bold text-slate-700 dark:text-slate-200 text-sm flex items-center gap-2">
                            <span class="bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">2</span>
                            Tiempos y cliente
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Hora revisión</label>
                                <input type="time" id="hora2" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono dark:text-white outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Hora pago</label>
                                <input type="time" id="hora3" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono dark:text-white outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Hora descarga</label>
                                <input type="time" id="hora4" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm font-mono dark:text-white outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-12 gap-4">
                            <div class="col-span-12 sm:col-span-8">
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Nombre cliente</label>
                                <input type="text" id="cliente" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none" placeholder="Apellido y nombre">
                            </div>
                            <div class="col-span-12 sm:col-span-4">
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Tratamiento</label>
                                <select id="tipoCliente" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none">
                                    <option value="cliente">Cliente (Sr.)</option>
                                    <option value="clienta">Clienta (Sra.)</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Jefe de Caja</label>
                                <input type="text" id="jefeCaja" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Responsable descarga</label>
                                <input type="text" id="responsableDescarga" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none" placeholder="Por defecto: mismo que avisa">
                            </div>
                        </div>
                    </div>

                    <!-- Info adicional -->
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
                        <h3 class="font-bold text-slate-700 dark:text-slate-200 text-sm flex items-center gap-2">
                            <span class="bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">3</span>
                            Información adicional
                        </h3>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Máquina</label>
                                <input type="text" id="maquinaInfo" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none" placeholder="Opcional">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Juego</label>
                                <input type="text" id="juegoInfo" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none" placeholder="Opcional">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Pago manual</label>
                                <input type="text" id="pagoManualInfo" class="w-full p-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm dark:text-white outline-none" placeholder="Opcional">
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-3 pt-1">
                        <button type="button" onclick="generateText()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm transition flex items-center gap-2 cursor-pointer">
                            <i data-lucide="wand-2" class="w-4 h-4"></i> Actualizar Informe
                        </button>
                        <button type="button" id="btnLimpiar" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-semibold rounded-xl transition flex items-center gap-2 cursor-pointer">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Limpiar
                        </button>
                    </div>
                </form>
            </div>

            <!-- Vista previa -->
            <div class="lg:col-span-5 bg-slate-100 dark:bg-slate-950/60 border-t lg:border-t-0 lg:border-l border-slate-200 dark:border-slate-800 flex flex-col">
                <div class="p-6 sticky top-0 space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="font-bold text-slate-800 dark:text-slate-100">Vista previa</h2>
                        <span class="text-xs bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 px-2.5 py-0.5 rounded-full font-semibold">En vivo</span>
                    </div>

                    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-300 dark:border-slate-700 p-1 relative group">
                        <textarea id="outputText" class="w-full h-80 p-4 text-xs sm:text-sm font-mono leading-relaxed bg-transparent text-slate-700 dark:text-slate-200 resize-y outline-none" spellcheck="false"></textarea>
                        <button type="button" onclick="copyText()" class="mt-2 w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow transition flex items-center justify-center gap-2 cursor-pointer">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                            <span class="text-sm font-bold">Copiar Informe</span>
                        </button>
                    </div>

                    <div id="toast" class="hidden bg-emerald-100 dark:bg-emerald-950 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200 px-4 py-3 rounded-xl text-sm flex items-center gap-2 fade-in">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                        <span>Copiado al portapapeles.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatCurrency(amount) {
            return new Intl.NumberFormat('es-AR', {
                style: 'decimal',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount || 0);
        }

        function generateText() {
            const hora1 = document.getElementById('hora1').value || '--:--';
            const hora2 = document.getElementById('hora2').value || '--:--';
            const hora3 = document.getElementById('hora3').value || '--:--';
            const hora4 = document.getElementById('hora4').value || '--:--';

            const nombrePersonal = document.getElementById('nombrePersonal').value.trim() || '___';
            const responsableDescarga = document.getElementById('responsableDescarga').value.trim() || nombrePersonal;
            const nombreMaquina = document.getElementById('nombreMaquina').value.trim() || '___';
            const valorDe = parseFloat(document.getElementById('valorDe').value) || 0;
            const progresivoValor = parseFloat(document.getElementById('progresivoValor').value) || 0;
            const totalInput = parseFloat(document.getElementById('totalPremio').value);
            const totalPremio = isNaN(totalInput) ? valorDe + progresivoValor : totalInput;

            const cliente = document.getElementById('cliente').value.trim() || '___';
            const tipoCliente = document.getElementById('tipoCliente').value;
            const jefeCaja = document.getElementById('jefeCaja').value.trim() || '___';
            const ventanilla = document.getElementById('ventanilla').value.trim() || '___';
            const maquinaInfo = document.getElementById('maquinaInfo').value.trim() || '---';
            const juegoInfo = document.getElementById('juegoInfo').value.trim() || '---';
            const pagoManualInfo = document.getElementById('pagoManualInfo').value.trim() || '---';

            const prefijo = tipoCliente === 'clienta' ? 'la Sra.' : 'el Sr.';

            const texto = `A las ${hora1} Hs. CCTV recibe llamada de ${nombrePersonal}, informa Jackpot en Máq. ${nombreMaquina} por un valor de $${formatCurrency(valorDe)}, se suma progresivo de $${formatCurrency(progresivoValor)} alcanzando un total de $${formatCurrency(totalPremio)}.-
(A las ${hora2} Hs.) Revisión muestra que ${prefijo} ${cliente} jugaba en Máq. ${nombreMaquina} al salir el premio.-
A las ${hora3} Hs. Jefe de Caja ${jefeCaja} cancela en ventanilla ${ventanilla} $${formatCurrency(totalPremio)} a ${prefijo} ${cliente}.-
A las ${hora4} Hs. ${responsableDescarga} registra y descarga el premio de Máq. ${nombreMaquina}.-

Máquina: ${maquinaInfo}
Juego: ${juegoInfo}
Pago manual: ${pagoManualInfo}

Apéndice 1: Fotos.-`;

            document.getElementById('outputText').value = texto;
        }

        async function copyText() {
            const area = document.getElementById('outputText');
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(area.value);
                } else {
                    area.select();
                    area.setSelectionRange(0, 99999);
                    document.execCommand('copy');
                }
            } catch (e) {
                area.select();
                area.setSelectionRange(0, 99999);
                document.execCommand('copy');
            }

            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function toggleTheme() {
            if (window.CCTVTheme) {
                window.CCTVTheme.toggle();
                return;
            }
            const isDark = document.documentElement.classList.toggle('dark');
            try {
                localStorage.setItem('cctv_theme', isDark ? 'dark' : 'light');
            } catch (e) {}
        }

        document.getElementById('btnLimpiar').addEventListener('click', () => {
            document.querySelectorAll('#textForm input, #textForm select').forEach(el => {
                if (el.type === 'select-one') {
                    el.selectedIndex = 0;
                } else {
                    el.value = '';
                }
            });
            generateText();
        });

        document.getElementById('textForm').addEventListener('input', generateText);
        document.getElementById('textForm').addEventListener('change', generateText);

        lucide.createIcons();
        document.getElementById('fechaActual').textContent = new Date().toLocaleDateString('es-AR');
        generateText();
    </script>
    <script src="js/global.js"></script>
</body>
</html>
